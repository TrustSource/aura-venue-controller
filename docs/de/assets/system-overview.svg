<svg xmlns="http://www.w3.org/2000/svg" width="680" height="410" viewBox="0 0 680 410" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Architektur Aura Venue</title>
<desc>Drei Geräte: ein Engineering-PC mit der Studio-Software, ein Controller mit vier Software-Schichten und ein Verstärker mit Firmware. Der PC lädt die Anwendungslogik auf den Controller, der Controller steuert den Verstärker.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="410" fill="#FFFFFF"/>
<g fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5">
<rect x="40" y="40" width="150" height="310" rx="16"/>
<rect x="210" y="40" width="240" height="310" rx="16"/>
<rect x="475" y="40" width="165" height="310" rx="16"/>
</g>
<g text-anchor="middle" dominant-baseline="central" fill="#444441" font-size="14" font-weight="500">
<text x="115" y="64">Engineering-PC</text>
<text x="330" y="64">Venue Controller</text>
<text x="557" y="64">Venue Amp</text>
</g>
<g text-anchor="middle" dominant-baseline="central" fill="#5F5E5A" font-size="12">
<text x="115" y="82">Windows, beim Planer</text>
<text x="330" y="82">kleiner Linux-Rechner im Gebäude</text>
<text x="557" y="82">Mikrocontroller, viele Stück</text>
</g>
<g fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5">
<rect x="55" y="160" width="120" height="52" rx="8"/>
<rect x="225" y="100" width="210" height="52" rx="8"/>
<rect x="225" y="220" width="210" height="52" rx="8"/>
<rect x="225" y="280" width="210" height="52" rx="8"/>
<rect x="487" y="160" width="141" height="52" rx="8"/>
</g>
<rect x="225" y="160" width="210" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<g text-anchor="middle" dominant-baseline="central" fill="#3C3489" font-size="14" font-weight="500">
<text x="115" y="177">Studio</text>
<text x="330" y="117">Steuerlogik</text>
<text x="330" y="237">Weboberfläche und Dienste</text>
<text x="330" y="297">Linux-Betriebssystem</text>
<text x="557" y="177">Firmware</text>
</g>
<g text-anchor="middle" dominant-baseline="central" fill="#534AB7" font-size="12">
<text x="115" y="196">venue-studio</text>
<text x="330" y="136">venue-plc-app</text>
<text x="330" y="256">venue-controller-webui</text>
<text x="330" y="316">venue-controller-rootfs</text>
<text x="557" y="196">venue-amp-firmware</text>
</g>
<text x="330" y="177" text-anchor="middle" dominant-baseline="central" fill="#712B13" font-size="14" font-weight="500">Laufzeit</text>
<text x="330" y="196" text-anchor="middle" dominant-baseline="central" fill="#993C1D" font-size="12">logiccore-runtime</text>
<g stroke="#5F5E5A" stroke-width="1.5" fill="none">
<line x1="177" y1="186" x2="221" y2="186" marker-end="url(#arrow)"/>
<line x1="437" y1="186" x2="483" y2="186" marker-end="url(#arrow)"/>
</g>
<rect x="40" y="374" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="60" y="380" dominant-baseline="central" fill="#5F5E5A" font-size="12">von Aurelia Audio gebaut, mit Open Source darin</text>
<rect x="330" y="374" width="12" height="12" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="350" y="380" dominant-baseline="central" fill="#5F5E5A" font-size="12">zugekauft, ohne Quellcode</text>
</svg>
