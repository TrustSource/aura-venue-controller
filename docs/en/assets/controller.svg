<svg xmlns="http://www.w3.org/2000/svg" width="680" height="458" viewBox="0 0 680 458" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Venue Controller</title>
<rect width="680" height="458" fill="#FFFFFF"/>
<rect x="20" y="16" width="640" height="392" rx="14" fill="#FAFAF7" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="40" y="40" font-size="14" font-weight="500" fill="#444441" dominant-baseline="central">Venue Controller</text>
<rect x="40" y="58" width="600" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="56" y="74" font-size="14" font-weight="500" fill="#444441" dominant-baseline="central">Control application</text>
<text x="56" y="92" font-size="12" fill="#5F5E5A" dominant-baseline="central">logic of one installation, written by the integrator</text>
<rect x="40" y="116" width="600" height="48" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="56" y="132" font-size="14" font-weight="500" fill="#712B13" dominant-baseline="central">Runtime</text>
<text x="56" y="150" font-size="12" fill="#993C1D" dominant-baseline="central">executes the control application</text>
<rect x="40" y="174" width="600" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="56" y="190" font-size="14" font-weight="500" fill="#3C3489" dominant-baseline="central">Web UI</text>
<text x="56" y="208" font-size="12" fill="#534AB7" dominant-baseline="central">configuration pages served by the device</text>
<rect x="40" y="232" width="600" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="56" y="248" font-size="14" font-weight="500" fill="#3C3489" dominant-baseline="central">Controller services</text>
<text x="56" y="266" font-size="12" fill="#534AB7" dominant-baseline="central">device management, update, audio routing</text>
<rect x="40" y="290" width="600" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="56" y="306" font-size="14" font-weight="500" fill="#444441" dominant-baseline="central">Linux operating system</text>
<text x="56" y="324" font-size="12" fill="#5F5E5A" dominant-baseline="central">from aura-venue-os, included as linked module</text>
<rect x="40" y="348" width="600" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="56" y="364" font-size="14" font-weight="500" fill="#3C3489" dominant-baseline="central">Mainboard</text>
<text x="56" y="382" font-size="12" fill="#534AB7" dominant-baseline="central">processor, memory, network, secure element, service ports</text>
<rect x="20" y="432" width="12" height="12" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="38" y="438" font-size="12" fill="#5F5E5A" dominant-baseline="central">from another party or repository</text>
<rect x="254" y="432" width="12" height="12" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="272" y="438" font-size="12" fill="#5F5E5A" dominant-baseline="central">purchased, no source code</text>
<rect x="444" y="432" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="462" y="438" font-size="12" fill="#5F5E5A" dominant-baseline="central">built by Aurelia Audio</text>
</svg>
