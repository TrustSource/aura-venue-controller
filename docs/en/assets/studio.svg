<svg xmlns="http://www.w3.org/2000/svg" width="680" height="342" viewBox="0 0 680 342" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Venue Studio</title>
<rect width="680" height="342" fill="#FFFFFF"/>
<rect x="20" y="16" width="640" height="276" rx="14" fill="#FAFAF7" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="40" y="40" font-size="14" font-weight="500" fill="#444441" dominant-baseline="central">Venue Studio</text>
<rect x="40" y="58" width="600" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="56" y="74" font-size="14" font-weight="500" fill="#3C3489" dominant-baseline="central">Front end</text>
<text x="56" y="92" font-size="12" fill="#534AB7" dominant-baseline="central">configuration and logic editor, npm packages</text>
<rect x="40" y="116" width="600" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="56" y="132" font-size="14" font-weight="500" fill="#3C3489" dominant-baseline="central">Desktop application</text>
<text x="56" y="150" font-size="12" fill="#534AB7" dominant-baseline="central">project handling, talks to the controller, .NET packages</text>
<rect x="40" y="174" width="600" height="48" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="56" y="190" font-size="14" font-weight="500" fill="#712B13" dominant-baseline="central">Bundled third-party run-time</text>
<text x="56" y="208" font-size="12" fill="#993C1D" dominant-baseline="central">installed by the installer, in no package manifest</text>
<rect x="40" y="232" width="600" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="56" y="248" font-size="14" font-weight="500" fill="#444441" dominant-baseline="central">Sample control application</text>
<text x="56" y="266" font-size="12" fill="#5F5E5A" dominant-baseline="central">written by the integrator, refers to function libraries</text>
<rect x="20" y="316" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="38" y="322" font-size="12" fill="#5F5E5A" dominant-baseline="central">built by Aurelia Audio</text>
<rect x="190" y="316" width="12" height="12" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="208" y="322" font-size="12" fill="#5F5E5A" dominant-baseline="central">purchased, no source code</text>
<rect x="380" y="316" width="12" height="12" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="398" y="322" font-size="12" fill="#5F5E5A" dominant-baseline="central">from another party or repository</text>
</svg>
