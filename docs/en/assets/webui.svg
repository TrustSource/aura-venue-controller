<svg xmlns="http://www.w3.org/2000/svg" width="680" height="342" viewBox="0 0 680 342" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Web UI</title>
<rect width="680" height="342" fill="#FFFFFF"/>
<rect x="20" y="16" width="640" height="276" rx="14" fill="#FAFAF7" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="40" y="40" font-size="14" font-weight="500" fill="#444441" dominant-baseline="central">Web UI</text>
<rect x="40" y="58" width="600" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="56" y="74" font-size="14" font-weight="500" fill="#3C3489" dominant-baseline="central">Configuration pages</text>
<text x="56" y="92" font-size="12" fill="#534AB7" dominant-baseline="central">zones, sources, network, users</text>
<rect x="40" y="116" width="600" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="56" y="132" font-size="14" font-weight="500" fill="#085041" dominant-baseline="central">Script interpreter</text>
<text x="56" y="150" font-size="12" fill="#0F6E56" dominant-baseline="central">bundled binary, version visible only in the binary</text>
<rect x="40" y="174" width="600" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="56" y="190" font-size="14" font-weight="500" fill="#085041" dominant-baseline="central">Web server</text>
<text x="56" y="208" font-size="12" fill="#0F6E56" dominant-baseline="central">bundled binary</text>
<rect x="40" y="232" width="600" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="56" y="248" font-size="14" font-weight="500" fill="#085041" dominant-baseline="central">TLS library</text>
<text x="56" y="266" font-size="12" fill="#0F6E56" dominant-baseline="central">bundled binary, encrypts the connection</text>
<rect x="20" y="316" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="38" y="322" font-size="12" fill="#5F5E5A" dominant-baseline="central">built by Aurelia Audio</text>
<rect x="190" y="316" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="208" y="322" font-size="12" fill="#5F5E5A" dominant-baseline="central">open source</text>
</svg>
